name: luvhi — check or scheduled handoff
run-name: ${{ inputs.mode == 'check' && 'luvhi · 2-minute connection check' || format('luvhi · handoff from {0}', inputs.source_run) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = 2 minutes; handoff = 8 hours after the supplied start time'
        type: choice
        required: true
        default: check
        options: [check, handoff]
      start_epoch:
        description: 'Filled automatically by Sothey; Unix timestamp in seconds'
        type: string
        default: '0'
      source_run:
        description: 'Filled automatically by Sothey; source workflow run ID'
        type: string
        default: '0'
      expect_new:
        description: 'First registration only: stop instead of guessing a pre-existing account password'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: luvhi-exvxeldo
  cancel-in-progress: false

env:
  MC_HOST: exvxeldo.de5.net
  MC_PORT: '21734'
  MC_USERNAME: luvhi
  BOT_IDLE_ACTIVITY_SECONDS: '45'

jobs:
  luvhi_first:
    name: luvhi 1/2
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run check && npm test
      - name: Wait for the 20-minute overlap
        if: inputs.mode == 'handoff'
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_START_EPOCH: ${{ inputs.start_epoch }}
          HANDOFF_SOURCE_RUN: ${{ inputs.source_run }}
        run: node scripts/wait-handoff.js
      - name: Connect luvhi
        env:
          MC_PASSWORD: ${{ secrets.LUVHI_PASSWORD }}
          BOT_RUN_SECONDS: ${{ inputs.mode == 'check' && '120' || '14400' }}
          BOT_MIN_READY_SECONDS: ${{ inputs.mode == 'check' && '60' || '30' }}
          BOT_EXPECT_NEW_ACCOUNT: ${{ inputs.expect_new && 'true' || 'false' }}
          BRIDGE_ENABLED: ${{ inputs.mode == 'handoff' && 'true' || 'false' }}
          SOURCE_JOB_NAME: 'luvhi 1/2'
          GH_TOKEN: ${{ github.token }}
        run: node scripts/session.js
      - name: Status report
        if: always()
        run: if [ -f reports/status.json ]; then cat reports/status.json; fi

  luvhi_second:
    name: luvhi 2/2
    if: inputs.mode == 'handoff'
    needs: luvhi_first
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Connect luvhi
        env:
          MC_PASSWORD: ${{ secrets.LUVHI_PASSWORD }}
          BOT_RUN_SECONDS: '14400'
          BOT_MIN_READY_SECONDS: '30'
        run: node src/main.js
      - name: Status report
        if: always()
        run: if [ -f reports/status.json ]; then cat reports/status.json; fi
