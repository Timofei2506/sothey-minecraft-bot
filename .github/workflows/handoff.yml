name: Sothey to luvhi — one-off handoff
run-name: Sothey 8h → luvhi 8h · 20-minute overlap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sothey-exvxeldo
  cancel-in-progress: false

env:
  MC_HOST: exvxeldo.de5.net
  MC_PORT: '21734'
  MC_USERNAME: Sothey
  BOT_RUN_SECONDS: '14400'
  BOT_MIN_READY_SECONDS: '30'
  BOT_IDLE_ACTIVITY_SECONDS: '45'

jobs:
  sothey_first:
    name: Sothey 1/2
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run check && npm test
      - name: Stay connected and arrange bridge
        env:
          MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
          BRIDGE_ENABLED: 'true'
          SOURCE_JOB_NAME: 'Sothey 1/2'
          GH_TOKEN: ${{ github.token }}
        run: node scripts/session.js
      - name: Status report
        if: always()
        run: if [ -f reports/status.json ]; then cat reports/status.json; fi

  sothey_second:
    name: Sothey 2/2
    needs: sothey_first
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run check && npm test
      - name: Stay connected and arrange handoff
        env:
          MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
          HANDOFF_ENABLED: 'true'
          GH_TOKEN: ${{ github.token }}
        run: node scripts/session.js
      - name: Status and handoff reports
        if: always()
        run: |
          if [ -f reports/status.json ]; then cat reports/status.json; fi
          if [ -f reports/handoff.json ]; then cat reports/handoff.json; fi
